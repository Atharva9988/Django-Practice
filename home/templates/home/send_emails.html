<!DOCTYPE html>
<html>
<head><title>Send Email</title></head>
<body>
  <h2>Send Email</h2>
  {% if success %}<p style="color:green">{{ success }}</p>{% endif %}
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="email" name="to_email" placeholder="Recipient email" required><br><br>
    <input type="text" name="subject" placeholder="Subject" required><br><br>
    <textarea name="message" rows="6" placeholder="Message" required></textarea><br><br>
    <button type="submit">Send</button>
  </form>
</body>
</html>
