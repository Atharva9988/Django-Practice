<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send Email</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 2rem 1rem; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    label { display: block; font-size: .9rem; margin-bottom: .25rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: .6rem; border: 1px solid #ccc; border-radius: 4px; font: inherit; margin-bottom: 1rem; }
    input:focus, textarea:focus { outline: 2px solid #2563eb; border-color: transparent; }
    textarea { resize: vertical; }
    button { width: 100%; padding: .7rem; border: 0; border-radius: 4px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg { padding: .6rem .8rem; border-radius: 4px; margin-bottom: 1rem; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Send Email</h2>

    <div aria-live="polite">
      {% if success %}<p class="msg success">{{ success }}</p>{% endif %}
      {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
    </div>

    <form method="post" id="email-form">
      {% csrf_token %}

      <label for="to_email">To</label>
      <input type="email" id="to_email" name="to_email" maxlength="254"
             value="{{ form_data.to_email|default:'' }}" required>

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" maxlength="150"
             value="{{ form_data.subject|default:'' }}" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" maxlength="5000" required>{{ form_data.message|default:'' }}</textarea>

      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('email-form');
    const btn = document.getElementById('send-btn');
    form.addEventListener('submit', () => {
      btn.disabled = true;
      btn.textContent = 'Sending...';
    });
  </script>
</body>
</html>
